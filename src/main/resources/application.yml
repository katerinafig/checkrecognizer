spring:
  config:
    import:
      - optional:env.properties
  ai:
    gigachat:
      auth:
        bearer:
          api-key: ${API_KEY:}
        scope: GIGACHAT_API_PERS
        unsafe-ssl: true
      chat:
        options:
          model: GigaChat-2-Max
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ''

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      path: /h2-console
server:
  port: 8080